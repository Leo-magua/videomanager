<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">视频管理器</title>
  <desc id="desc">手机发起操作，Mac 保存资料并调度，Windows 存放视频并执行文件操作。视频优先从 Windows 直连手机播放。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #172033; }
      .name { font-size: 27px; font-weight: 600; }
      .detail { font-size: 18px; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="470" fill="white"/>
  <text x="560" y="68" font-size="30" font-weight="650">视频管理器</text>
  <g fill="#fff" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="70" y="143" width="260" height="160" rx="16"/>
    <rect x="430" y="143" width="260" height="160" rx="16"/>
    <rect x="790" y="143" width="260" height="160" rx="16"/>
  </g>
  <text class="name" x="200" y="207">手机</text>
  <text class="detail" x="200" y="250">浏览 · 播放 · 整理</text>
  <text class="name" x="560" y="207">Mac</text>
  <text class="detail" x="560" y="250">保存资料 · 调度</text>
  <text class="name" x="920" y="207">Windows</text>
  <text class="detail" x="920" y="250">存放视频 · 管理文件</text>
  <path class="line" d="M342 223 H418"/>
  <text class="detail" x="380" y="204" style="font-size:16px">操作</text>
  <path class="line" d="M702 223 H778"/>
  <text class="detail" x="740" y="204" style="font-size:16px">执行</text>
  <path d="M920 315 V377 Q920 389 908 389 H212 Q200 389 200 377 V315" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="466" y="372" width="188" height="34" rx="17" fill="white"/>
  <text x="560" y="395" font-size="18" style="fill:#2563eb">视频优先直连播放</text>
</svg>
